# tmux config - deployed to ~/.config/tmux/tmux.conf by tmux/install.ps1.
# Linux only: this repo does not install tmux on Windows (no native build;
# use WezTerm's own multiplexer there instead).
#
# Deliberately small - a sane baseline, not a framework. Add keybindings /
# theming below as needed.

# --- Colours / Unicode ----------------------------------------------------
# tmux-256color is the terminfo entry whose behaviour tmux itself targets;
# the outer terminal's 24-bit colour is advertised with the RGB feature so
# truecolor passes through (WezTerm, Windows Terminal, etc. all support it).
# Note: there is NO "unicode11" option or terminal-feature in tmux - its
# character-width tables are built in and updated per release. Nothing to
# set for that here.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Let programs running inside tmux emit raw escape sequences (terminal
# image protocols, OSC 52 clipboard writes from nested apps, ...).
set -g allow-passthrough on

# --- Behaviour ----------------------------------------------------------
# tmux's default is 500ms, which puts a visible lag on <Esc> in vim/nvim.
set -sg escape-time 10

# Let nvim see focus-gained / focus-lost (':set autoread', etc.).
set -g focus-events on

# Default scrollback is a stingy 2000 lines.
set -g history-limit 50000

set -g mouse on

# --- Clipboard --------------------------------------------------------
# Copy-mode yanks go to the outer terminal's clipboard via OSC 52 - works
# over SSH too, when the terminal supports it (WezTerm and Windows Terminal
# both do).
set -g set-clipboard on
