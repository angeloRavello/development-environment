# Yazi keymap - https://yazi-rs.github.io/docs/configuration/keymap
# Empty on purpose: this file exists so you can override/add keybindings
# without touching yazi's built-in defaults. Example:
#
# [[mgr.prepend_keymap]]
# on = ["g", "h"]
# run = "cd ~"
# desc = "Go home"
#
# On Windows, ../install.ps1 appends a "g" + <DRIVE LETTER> entry here for
# every fixed drive it finds on the machine being bootstrapped (e.g.
# "g C" -> cd C:\) before deploying this file - not written here directly,
# since the drives on THIS machine aren't necessarily the drives on any
# other machine this repo gets cloned onto.
